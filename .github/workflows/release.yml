name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS universal (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build both architectures
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --features gpu,webview --target "$t"
          done

      - name: Combine into a universal binary
        run: |
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/rift \
            target/x86_64-apple-darwin/release/rift \
            -output target/release/rift
          lipo -info target/release/rift

      - name: Bundle Rift.app
        run: RIFT_VERSION="$VERSION" SKIP_BUILD=1 bash scripts/bundle_macos.sh

      # TODO(signing): enable once the repo has these secrets:
      #   MACOS_CERT_P12 (base64 Developer ID Application cert), MACOS_CERT_PASSWORD,
      #   MACOS_SIGN_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD.
      - name: Import signing certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm cert.p12

      - name: Codesign app
        if: ${{ env.MACOS_SIGN_IDENTITY != '' }}
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" target/Rift.app

      - name: Create dmg
        run: |
          mkdir -p dist dmgroot
          cp -R target/Rift.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Rift" -srcfolder dmgroot -ov -format UDZO "dist/Rift-${VERSION}-macos.dmg"

      - name: Notarize dmg
        if: ${{ env.APPLE_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "dist/Rift-${VERSION}-macos.dmg" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/Rift-${VERSION}-macos.dmg"

      - name: Checksum
        run: cd dist && shasum -a 256 "Rift-${VERSION}-macos.dmg" > "Rift-${VERSION}-macos.dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    name: Linux x86_64 (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxrandr-dev libxi-dev libxcursor-dev libgtk-3-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --release --features gpu

      - name: Package
        run: |
          name="rift-${VERSION}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/rift LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
